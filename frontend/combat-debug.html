<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔ 전투 UI 디버그</title>
<link rel="stylesheet" href="./game.css">
<style>
  body { margin: 0; background: var(--bg-tertiary); }

  /* ── 디버그 컨트롤 패널 (z-index 1000, 오버레이 위) ── */
  #dbg-panel {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000;
    background: rgba(12, 12, 14, 0.92);
    border: 1px solid #333; border-radius: 8px;
    padding: 8px 14px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: sans-serif; font-size: 11px; color: #aaa;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    user-select: none;
  }
  #dbg-panel label  { color: #666; font-size: 10px; letter-spacing: 0.05em; }
  #dbg-panel select {
    background: #1c1c1e; color: #ccc; border: 1px solid #3a3a3a;
    border-radius: 4px; padding: 3px 6px; font-size: 11px; cursor: pointer;
  }
  #dbg-panel button {
    background: #2a2a2e; color: #ccc; border: 1px solid #3a3a3a;
    border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer;
    white-space: nowrap; transition: background 0.1s;
  }
  #dbg-panel button:hover { background: #3a3a3e; }
  #dbg-panel button.btn-win  { border-color: rgba(93,187,139,0.5); color: #5DBB8B; }
  #dbg-panel button.btn-loss { border-color: rgba(226,75,74,0.5);  color: #E24B4A; }
  #dbg-panel .sep { color: #333; }
  #dbg-panel .dbg-title { color: #666; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>

<!-- 툴팁 (combat-ui.js 내 hover 시스템용 placeholder) -->
<div class="tooltip" id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-sub"  id="tt-sub"></div>
  <div class="tt-body" id="tt-body"></div>
  <hr class="tt-divider" id="tt-div" style="display:none">
  <div id="tt-rows"></div>
  <div id="tt-tags"></div>
</div>

<div id="combat-overlay"></div>

<!-- ── 디버그 컨트롤 ── -->
<div id="dbg-panel">
  <span class="dbg-title">⚔ 전투 디버그</span>
  <span class="sep">|</span>

  <label>시나리오</label>
  <select id="dbg-scenario" onchange="dbgChangeScenario(this.value)">
    <option value="rome">동로마 vs 서고트 (378)</option>
    <option value="ottoman">오스만 vs 비잔틴 (1402)</option>
    <option value="deluge">폴란드 vs 스웨덴 (1656)</option>
    <option value="custom">커스텀</option>
  </select>

  <span class="sep">|</span>
  <label>첩보</label>
  <select id="dbg-intel" onchange="dbgSetIntel(this.value)">
    <option value="medium">보통</option>
    <option value="low">저급</option>
    <option value="high">고급</option>
  </select>

  <label>날씨</label>
  <select id="dbg-weather" onchange="dbgSetWeather(this.value)">
    <option value="clear">맑음</option>
    <option value="rain">강우</option>
    <option value="heat">폭염</option>
    <option value="fog">짙은 안개</option>
    <option value="snow">강설</option>
    <option value="sandstorm">모래폭풍</option>
  </select>

  <label>지형</label>
  <select id="dbg-terrain" onchange="dbgSetTerrain(this.value)">
    <option value="plain">평지</option>
    <option value="highland">고지</option>
    <option value="forest">삼림</option>
    <option value="riverside">강변</option>
    <option value="desert">사막</option>
  </select>

  <span class="sep">|</span>
  <label>페이즈 결과</label>
  <select id="dbg-outcome">
    <option value="minor_success">소폭 우세</option>
    <option value="major_success">전술 우세</option>
    <option value="critical_success">결정적 우세</option>
    <option value="stalemate">교착</option>
    <option value="minor_fail">소폭 열세</option>
    <option value="major_fail">전술 열세</option>
    <option value="critical_fail">결정적 열세</option>
  </select>
  <button onclick="dbgNextPhase()">▶ 다음 페이즈</button>

  <span class="sep">|</span>
  <button class="btn-win"  onclick="dbgEndCombat('player')">✓ 승리 종결</button>
  <button class="btn-loss" onclick="dbgEndCombat('enemy')">✗ 패배 종결</button>
  <button onclick="dbgReset()">↺ 초기화</button>
</div>

<script src="./game-markdown.js"></script>

function _patchStateForDebug(state) {
  if (!state.pushHistory) state.pushHistory = () => {};
  if (!state.getHistory)  state.getHistory  = () => [];
  return state;
}

function _rollRange(range) {
  const [lo, hi] = range;
  return Math.floor(Math.random() * (hi - lo + 1)) + lo;
}

function _buildMockContent(outcome) {
  const narrative = _MOCK_NARRATIVE[outcome] || _MOCK_NARRATIVE.stalemate;
  const choices = (_MOCK_CHOICES[outcome] || _MOCK_CHOICES.stalemate)
    .map(c => `- [${c.type}] ${c.text}`)
    .join('\n');
  return `${narrative}\n\n**결정 시점:**\n${choices}`;
}

    critical_success: { tier: '결정적 우세', net:  8, roll_detail: { ally: 15, enemy: 7  }, modifiers: [['지형 우세',    3], ['전술 판단 (!)', 2]] },
    major_success:    { tier: '전술 우세',   net:  5, roll_detail: { ally: 12, enemy: 7  }, modifiers: [['전술 판단 (!)', 2]] },
    minor_success:    { tier: '소폭 우세',   net:  2, roll_detail: { ally: 10, enemy: 8  }, modifiers: [['소속 우세 (?!)',1]] },
    stalemate:        { tier: '교착',         net:  0, roll_detail: { ally: 9,  enemy: 9  }, modifiers: [] },
    minor_fail:       { tier: '소폭 열세',   net: -2, roll_detail: { ally: 7,  enemy: 9  }, modifiers: [['지형 불리 (=)', -2]] },
    major_fail:       { tier: '전술 열세',   net: -5, roll_detail: { ally: 5,  enemy: 10 }, modifiers: [] },
    critical_fail:    { tier: '결정적 열세', net: -8, roll_detail: { ally: 3,  enemy: 11 }, modifiers: [] },
  };
  return { ...base, ...(outcomes[outcome] || outcomes.stalemate) };
}

// ═══════════════════════════════════════════════════════════════════════════
//  _state 빌더
// ═══════════════════════════════════════════════════════════════════════════

function _buildState(scenarioKey, overrides) {
  const sc = _SCENARIOS[scenarioKey] || _SCENARIOS.rome;
  const tpp = sc.tpp;
  const factions = new Map([
    [sc.playerFaction.id, {
      ...sc.playerFaction,
      strength_score: Math.round(sc.playerFaction.field_army / tpp) + 50,
    }],
    [sc.enemyFaction.id, {
      ...sc.enemyFaction,
      strength_score: Math.round(sc.enemyFaction.field_army / tpp) + 30,
    }],
  ]);
  const characters = new Map([
    [sc.playerChar.id, sc.playerChar],
    [sc.enemyChar.id,  sc.enemyChar],
  ]);
  return {
    factions,
    characters,
    protagonist:     sc.playerChar.id,
    troopsPerPoint:  tpp,
    weather:         overrides.weather  || sc.weather,
    scenarioId:      'debug',
    combatState: {
      active:               true,
      phase_number:         1,
      max_phases:           6,
      player_faction_id:    sc.playerFaction.id,
      enemy_faction_id:     sc.enemyFaction.id,
      player_morale:        100,
      enemy_morale:         100,
      battle_location_name: sc.location,
      battle_year:          sc.year,
      battle_terrain:       overrides.terrain || sc.terrain,
      is_siege:             false,
      pending_battle_damage:{},
      phase_results:        [],
      enemy_intel_level:    overrides.intel  || 'medium',
    },
  };
}

// ═══════════════════════════════════════════════════════════════════════════
//  현재 디버그 상태
// ═══════════════════════════════════════════════════════════════════════════

let _dbgScenario = 'rome';

function _getOverrides() {
  return {
    intel:   document.getElementById('dbg-intel')?.value   || 'medium',
    weather: document.getElementById('dbg-weather')?.value || 'clear',
    terrain: document.getElementById('dbg-terrain')?.value || 'plain',
  };
}

// ═══════════════════════════════════════════════════════════════════════════
//  디버그 액션 함수 (컨트롤 패널 버튼에서 호출)
// ═══════════════════════════════════════════════════════════════════════════

function dbgReset() {
  window._state = _patchStateForDebug(_buildState(_dbgScenario, _getOverrides()));
  window._manager._state = window._state;
  const initContent = _buildMockContent('minor_success');
  const initRes     = _buildMockResolution('minor_success');
  openCombatOverlay(initContent, initRes);
}

function dbgChangeScenario(key) {
  _dbgScenario = key;
  dbgReset();
}

function dbgSetIntel(level) {
  if (window._state?.combatState) {
    window._state.combatState.enemy_intel_level = level;
    dbgReset();
  }
}

function dbgSetWeather(w) {
  if (window._state) {
    window._state.weather = w;
    dbgReset();
  }
}

function dbgSetTerrain(t) {
  if (window._state?.combatState) {
    window._state.combatState.battle_terrain = t;
    dbgReset();
  }
}

function dbgNextPhase() {
  if (!window._state?.combatState) return;
  const cs      = window._state.combatState;
  const outcome = document.getElementById('dbg-outcome')?.value || 'stalemate';
  const res     = _buildMockResolution(outcome);

  // 사기 변화 시뮬레이션 — resolver.py _PHASE_OUTCOME_MORALE 와 동일한 범위
  const moraleRanges = _MOCK_MORALE_DELTA[outcome] || { player: [0, 0], enemy: [0, 0] };
  const moraleShift = {
    player: _rollRange(moraleRanges.player),
    enemy:  _rollRange(moraleRanges.enemy),
  };

  cs.player_morale = Math.max(0, Math.min(100, (cs.player_morale ?? 100) + moraleShift.player));
  cs.enemy_morale  = Math.max(0, Math.min(100, (cs.enemy_morale  ?? 100) + moraleShift.enemy));

  // pending_battle_damage 누적 시뮬레이션
  const dmg = _MOCK_DAMAGE_DELTA[outcome] || { player: 5, enemy: 5 };

  const pFid = cs.player_faction_id;
  const eFid = cs.enemy_faction_id;
  cs.pending_battle_damage = cs.pending_battle_damage || {};
  cs.pending_battle_damage[pFid] = (cs.pending_battle_damage[pFid] || 0) + dmg.player;
  cs.pending_battle_damage[eFid] = (cs.pending_battle_damage[eFid] || 0) + dmg.enemy;

  // 페이즈 기록 추가
  cs.phase_results = [...(cs.phase_results || []), {
    phase:         cs.phase_number,
    phase_outcome: outcome,
    tier:          res.tier,
  }];
  cs.phase_number = (cs.phase_number || 1) + 1;

  // UI 갱신 (실제 게임과 동일한 함수 호출)
  _renderCombatMomentum(cs);
  _renderCombatLog(cs);
  _renderCombatScene(_buildMockContent(outcome), res);
}

function dbgEndCombat(winner) {
  if (!window._state?.combatState) return;
  const cs = window._state.combatState;
  const outcome = winner === 'player' ? 'major_success' : 'major_fail';
  const pFid = cs.player_faction_id;
  const eFid = cs.enemy_faction_id;

  cs.ended  = true;
  cs.active = false;
  cs.winner = winner;
  cs.retreat = false;
  cs.final_tier    = winner === 'player' ? '전술 우세' : '전술 열세';
  cs.final_tier_en = winner === 'player' ? 'success'   : 'failure';
  cs.pending_battle_damage = cs.pending_battle_damage || {};
  cs.pending_battle_damage[pFid] = (cs.pending_battle_damage[pFid] || 0) + (winner === 'player' ? 8 : 20);
  cs.pending_battle_damage[eFid] = (cs.pending_battle_damage[eFid] || 0) + (winner === 'player' ? 20 : 8);

  _renderCombatEnd(cs, _buildMockContent(outcome), _buildMockResolution(outcome));
}

// ═══════════════════════════════════════════════════════════════════════════
//  초기 실행
// ═══════════════════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => dbgReset());
</script>
